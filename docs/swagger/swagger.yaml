basePath: /api/v1
definitions:
  github_com_kagent-dev_khook_api_v1alpha2.ActiveEventStatus:
    properties:
      eventType:
        description: |-
          EventType is the type of the active event
          +kubebuilder:validation:Required
        type: string
      firstSeen:
        description: |-
          FirstSeen is when the event was first observed
          +kubebuilder:validation:Required
        type: string
      lastSeen:
        description: |-
          LastSeen is when the event was last observed
          +kubebuilder:validation:Required
        type: string
      resourceName:
        description: |-
          ResourceName is the name of the Kubernetes resource involved
          +kubebuilder:validation:Required
        type: string
      status:
        description: |-
          Status indicates whether the event is firing or resolved
          +kubebuilder:validation:Enum=firing;resolved
          +kubebuilder:validation:Required
        type: string
    type: object
  github_com_kagent-dev_khook_api_v1alpha2.EventConfiguration:
    properties:
      agentRef:
        allOf:
        - $ref: '#/definitions/github_com_kagent-dev_khook_api_v1alpha2.ObjectReference'
        description: |-
          AgentRef specifies the Kagent agent to call when this event occurs
          +kubebuilder:validation:Required
      eventType:
        description: |-
          EventType specifies the type of Kubernetes event to monitor
          +kubebuilder:validation:Enum=pod-restart;pod-pending;oom-kill;probe-failed;node-not-ready
          +kubebuilder:validation:Required
        type: string
      prompt:
        description: |-
          Prompt specifies the prompt template to send to the agent
          +kubebuilder:validation:Required
          +kubebuilder:validation:MinLength=1
        type: string
    type: object
  github_com_kagent-dev_khook_api_v1alpha2.HookStatus:
    properties:
      activeEvents:
        description: ActiveEvents contains the list of currently active events
        items:
          $ref: '#/definitions/github_com_kagent-dev_khook_api_v1alpha2.ActiveEventStatus'
        type: array
      lastUpdated:
        description: LastUpdated indicates when the status was last updated
        type: string
    type: object
  github_com_kagent-dev_khook_api_v1alpha2.ObjectReference:
    properties:
      name:
        description: |-
          Name of the referent.
          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
          +kubebuilder:validation:Required
          +kubebuilder:validation:MinLength=1
        type: string
      namespace:
        description: |-
          Namespace of the referent.
          If unspecified, the namespace of the Hook will be used.
          +kubebuilder:validation:Optional
        type: string
    type: object
  internal_apiserver.ConnectionInfo:
    properties:
      activeEventStreams:
        type: integer
    type: object
  internal_apiserver.DiagnosticsResponse:
    properties:
      apiStatus:
        type: string
      connectionInfo:
        $ref: '#/definitions/internal_apiserver.ConnectionInfo'
      eventStats:
        $ref: '#/definitions/internal_apiserver.EventStats'
      memoryUsage:
        $ref: '#/definitions/internal_apiserver.MemoryStats'
    type: object
  internal_apiserver.EventListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_apiserver.EventResponse'
        type: array
      total:
        type: integer
    type: object
  internal_apiserver.EventResponse:
    properties:
      eventType:
        type: string
      firstSeen:
        type: string
      lastSeen:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      namespace:
        type: string
      resourceName:
        type: string
      status:
        type: string
    type: object
  internal_apiserver.EventStats:
    properties:
      totalEvents:
        type: integer
      totalHooks:
        type: integer
    type: object
  internal_apiserver.EventSummaryResponse:
    properties:
      byEventType:
        additionalProperties:
          type: integer
        type: object
      bySeverity:
        additionalProperties:
          type: integer
        type: object
      firing:
        type: integer
      resolved:
        type: integer
      total:
        type: integer
    type: object
  internal_apiserver.EventsByTypeResponse:
    properties:
      byType:
        additionalProperties:
          $ref: '#/definitions/internal_apiserver.TypeStats'
        type: object
      total:
        type: integer
    type: object
  internal_apiserver.HealthResponse:
    properties:
      status:
        type: string
    type: object
  internal_apiserver.HookListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_apiserver.HookResponse'
        type: array
      total:
        type: integer
    type: object
  internal_apiserver.HookResponse:
    properties:
      eventConfigurations:
        items:
          $ref: '#/definitions/github_com_kagent-dev_khook_api_v1alpha2.EventConfiguration'
        type: array
      name:
        type: string
      namespace:
        type: string
      status:
        $ref: '#/definitions/github_com_kagent-dev_khook_api_v1alpha2.HookStatus'
    type: object
  internal_apiserver.MemoryStats:
    properties:
      alloc:
        type: integer
      numGC:
        type: integer
      sys:
        type: integer
      totalAlloc:
        type: integer
    type: object
  internal_apiserver.TypeStats:
    properties:
      count:
        type: integer
      percentage:
        type: number
    type: object
host: localhost:8082
info:
  contact:
    email: support@kagent.dev
    name: API Support
    url: https://kagent.dev
  description: HTTP API server for querying events, hooks, statistics, and health
    information
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Khook API Server
  version: "1.0"
paths:
  /diagnostics:
    get:
      consumes:
      - application/json
      description: Returns detailed diagnostic information including memory usage,
        connection info, and event statistics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_apiserver.DiagnosticsResponse'
      summary: Get diagnostics
      tags:
      - health
  /events:
    get:
      consumes:
      - application/json
      description: Returns a list of all active events with optional filtering
      parameters:
      - description: Filter by namespace
        in: query
        name: namespace
        type: string
      - description: Filter by event type (pod-restart, oom-kill, pod-pending, probe-failed,
          node-not-ready)
        in: query
        name: eventType
        type: string
      - description: Filter by resource name
        in: query
        name: resourceName
        type: string
      - description: Filter by status (firing, resolved)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_apiserver.EventListResponse'
      summary: List events
      tags:
      - events
  /events/stream:
    get:
      consumes:
      - application/json
      description: Returns a Server-Sent Events stream for real-time event updates
      produces:
      - text/event-stream
      responses:
        "200":
          description: Event stream
          schema:
            type: string
      summary: Stream events
      tags:
      - events
  /health:
    get:
      consumes:
      - application/json
      description: Returns the health status of the API server
      produces:
      - application/json
      responses:
        "200":
          description: Healthy status
          schema:
            $ref: '#/definitions/internal_apiserver.HealthResponse'
      summary: Health check
      tags:
      - health
  /hooks:
    get:
      consumes:
      - application/json
      description: Returns a list of all Hook configurations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_apiserver.HookListResponse'
      summary: List hooks
      tags:
      - hooks
  /metrics:
    get:
      consumes:
      - application/json
      description: Returns Prometheus-style metrics in text format
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus metrics
          schema:
            type: string
      summary: Get Prometheus metrics
      tags:
      - health
  /stats/events/by-type:
    get:
      consumes:
      - application/json
      description: Returns events grouped by type with counts and percentages
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_apiserver.EventsByTypeResponse'
      summary: Get events by type
      tags:
      - statistics
  /stats/events/summary:
    get:
      consumes:
      - application/json
      description: Returns event summary statistics including counts by severity and
        type
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_apiserver.EventSummaryResponse'
      summary: Get event summary
      tags:
      - statistics
schemes:
- http
- https
swagger: "2.0"
tags:
- description: Health and diagnostics endpoints
  name: health
- description: Event query and streaming endpoints
  name: events
- description: Hook configuration endpoints
  name: hooks
- description: Event statistics endpoints
  name: statistics
